name: CI

on:
  push:
    branches: [main]
    paths:
      - "creatoros/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "creatoros/**"
      - ".github/workflows/**"

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatoros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: creatoros/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci-only-test-secret-with-enough-entropy

      # Gate on what actually ships: a dev-only advisory in the test runner must
      # not block a release, but a vulnerable production dependency must be seen.
      - name: Audit production dependencies
        run: npm audit --omit=dev

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatoros
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: creatoros/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          AUTH_SECRET: ci-only-test-secret-with-enough-entropy
