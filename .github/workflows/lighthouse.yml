name: Lighthouse

# Performance + SEO (and a11y/best-practices) audit of the live CreatorOS site.
# Runs weekly and on demand, and on PRs that touch the app so a regression is
# visible before merge. Results land as a GitHub status check and as run
# artifacts (HTML + JSON reports).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site URL to audit"
        required: false
        default: "https://usecreatoros.co"
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    paths:
      - "creatoros/**"
  push:
    branches: [main]
    paths:
      - "creatoros/**"

jobs:
  lighthouse:
    name: Lighthouse (perf + SEO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.inputs.url || 'https://usecreatoros.co' }}
            ${{ github.event.inputs.url || 'https://usecreatoros.co' }}/pricing
            ${{ github.event.inputs.url || 'https://usecreatoros.co' }}/blog
          configPath: ./creatoros/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
